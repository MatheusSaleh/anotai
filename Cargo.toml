[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audio",
    "crates/transcribe",
    "crates/session",
    "crates/storage",
    "apps/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MatheusSaleh/anotai"
authors = ["Matheus Saleh"]
publish = false

# Shared versions for external crates. Crates opt in with `dep.workspace = true`.
[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
